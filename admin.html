<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - PHANTOM CLUB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        phantom: {
                            950: '#09090b',
                            900: '#121215',
                            800: '#18181b',
                            700: '#27272a',
                            600: '#3f3f46',
                            500: '#52525b',
                            400: '#a1a1aa',
                            300: '#d4d4d8',
                            200: '#e4e4e7',
                            100: '#f4f4f5'
                        }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #f4f4f5; -webkit-font-smoothing: antialiased; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
        .glass-panel { background: rgba(18, 18, 21, 0.75); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7); }
        .glow-white { box-shadow: 0 0 30px -5px rgba(255, 255, 255, 0.1); }
        .input-dark { background-color: rgba(9, 9, 11, 0.9); border: 1px solid rgba(255, 255, 255, 0.1); color: #ffffff; transition: all 0.2s ease; }
        .input-dark:focus { border-color: rgba(255, 255, 255, 0.4); outline: none; box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="bg-phantom-950 text-phantom-100 min-h-screen p-4 sm:p-8 pb-32">

    <!-- Pantalla de Login -->
    <div id="login-screen" class="fixed inset-0 z-50 bg-phantom-950 flex items-center justify-center p-4">
        <div class="glass-panel p-8 rounded-3xl max-w-md w-full space-y-6 text-center shadow-2xl border border-white/10">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-white/20 to-phantom-900 border border-white/30 flex items-center justify-center glow-white mx-auto">
                <svg class="w-7 h-7 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 2C8 2 5 5 5 9v8a3 3 0 003 3h8a3 3 0 003-3V9c0-4-3-7-7-7z"/>
                    <circle cx="9" cy="10" r="1.5" fill="currentColor"/>
                    <circle cx="15" cy="10" r="1.5" fill="currentColor"/>
                    <path stroke-linecap="round" d="M10 15h4"/>
                </svg>
            </div>
            <div>
                <h2 class="text-lg font-black tracking-widest text-white uppercase">PHANTOM CLUB</h2>
                <p class="text-xs text-phantom-400 mt-1">Ingresa la contraseña de administración</p>
            </div>
            <div class="space-y-4">
                <input type="password" id="login-password" placeholder="Contraseña..." class="w-full input-dark text-sm p-3.5 rounded-xl text-center tracking-widest" onkeydown="if(event.key === 'Enter') checkPassword()">
                <button onclick="checkPassword()" class="w-full py-3.5 rounded-xl bg-white hover:bg-phantom-200 text-black font-extrabold text-xs tracking-wider uppercase transition-all shadow-lg">Entrar al Panel</button>
            </div>
        </div>
    </div>

    <!-- Contenido del Panel (Oculto hasta autenticarse) -->
    <div id="admin-content" class="max-w-3xl mx-auto space-y-6 hidden">
        
        <!-- Header Principal Estilo Store -->
        <header class="flex items-center justify-between glass-panel p-5 sm:p-6 rounded-3xl">
            <div class="flex items-center gap-3.5">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-white/20 to-phantom-900 border border-white/30 flex items-center justify-center glow-white shrink-0">
                    <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 2C8 2 5 5 5 9v8a3 3 0 003 3h8a3 3 0 003-3V9c0-4-3-7-7-7z"/>
                        <circle cx="9" cy="10" r="1.5" fill="currentColor"/>
                        <circle cx="15" cy="10" r="1.5" fill="currentColor"/>
                        <path stroke-linecap="round" d="M10 15h4"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-black tracking-widest text-white uppercase leading-none">PHANTOM CLUB</h1>
                    <span class="text-[10px] sm:text-xs font-bold tracking-[0.2em] text-phantom-400 uppercase block mt-1">PANEL DE ADMINISTRACIÓN</span>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <a href="index.html" target="_blank" class="px-4 py-2.5 rounded-xl bg-white/10 hover:bg-white hover:text-black text-white text-xs font-bold transition-all border border-white/20 flex items-center gap-1.5 shadow-md">
                    <i data-lucide="external-link" class="w-3.5 h-3.5"></i><span>Ver Tienda</span>
                </a>
                <button onclick="logout()" class="p-2.5 rounded-xl bg-rose-500/10 hover:bg-rose-500 text-rose-400 hover:text-white transition-all border border-rose-500/20" title="Cerrar Sesión">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                </button>
            </div>
        </header>

        <!-- Configuración Global de WhatsApp y Mensajes (Guardado Independiente) -->
        <section class="glass-panel p-6 rounded-3xl space-y-5">
            <div class="flex items-center justify-between pb-3 border-b border-white/10">
                <div class="flex items-center gap-2">
                    <div class="p-2 rounded-xl bg-white/10 text-white"><i data-lucide="message-square-text" class="w-4 h-4"></i></div>
                    <h2 class="text-sm font-bold text-white uppercase tracking-wider">Ajustes de WhatsApp y Mensajes</h2>
                </div>
                <button onclick="saveWhatsAppConfig()" class="px-3.5 py-2 bg-emerald-500 hover:bg-emerald-400 text-black font-bold text-xs rounded-xl transition-all flex items-center gap-1.5 shadow-md">
                    <i data-lucide="check-circle" class="w-3.5 h-3.5"></i><span>Guardar WhatsApp</span>
                </button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-phantom-400 mb-1.5">Número de WhatsApp (con código de país):</label>
                    <input type="text" id="whatsapp-number" placeholder="584228705614" class="w-full input-dark text-sm p-3.5 rounded-xl">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-phantom-400 mb-1.5">Mensaje predeterminado de Compra (Carrito):</label>
                    <textarea id="whatsapp-message" rows="2" class="w-full input-dark text-sm p-3.5 rounded-xl"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-phantom-400 mb-1.5">Mensaje predeterminado de Preorden (Próximamente):</label>
                    <textarea id="preorder-message" rows="2" class="w-full input-dark text-sm p-3.5 rounded-xl"></textarea>
                </div>
            </div>
        </section>

        <!-- Visibilidad de Categorías (Guardado Independiente) -->
        <section class="glass-panel p-6 rounded-3xl space-y-4">
            <div class="flex items-center justify-between pb-3 border-b border-white/10">
                <div class="flex items-center gap-2">
                    <div class="p-2 rounded-xl bg-white/10 text-white"><i data-lucide="eye" class="w-4 h-4"></i></div>
                    <h2 class="text-sm font-bold text-white uppercase tracking-wider">Control de Visibilidad de Secciones</h2>
                </div>
                <button onclick="saveVisibilityConfig()" class="px-3.5 py-2 bg-emerald-500 hover:bg-emerald-400 text-black font-bold text-xs rounded-xl transition-all flex items-center gap-1.5 shadow-md">
                    <i data-lucide="check-circle" class="w-3.5 h-3.5"></i><span>Guardar Visibilidad</span>
                </button>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <label class="flex items-center justify-between p-4 rounded-2xl bg-phantom-900/90 border border-white/10 cursor-pointer hover:border-white/20 transition-all">
                    <span class="text-xs font-bold text-white">Gorras</span>
                    <input type="checkbox" id="toggle-gorras" class="w-5 h-5 accent-white rounded cursor-pointer">
                </label>
                <label class="flex items-center justify-between p-4 rounded-2xl bg-phantom-900/90 border border-white/10 cursor-pointer hover:border-white/20 transition-all">
                    <span class="text-xs font-bold text-white">Crocs</span>
                    <input type="checkbox" id="toggle-crocs" class="w-5 h-5 accent-white rounded cursor-pointer">
                </label>
                <label class="flex items-center justify-between p-4 rounded-2xl bg-phantom-900/90 border border-white/10 cursor-pointer hover:border-white/20 transition-all">
                    <span class="text-xs font-bold text-white">Próximamente</span>
                    <input type="checkbox" id="toggle-proximamente" class="w-5 h-5 accent-white rounded cursor-pointer">
                </label>
            </div>
        </section>

        <!-- Gestión de Productos (Guardado Directo del Catálogo) -->
        <section class="glass-panel p-6 rounded-3xl space-y-5">
            <div class="flex items-center justify-between pb-3 border-b border-white/10">
                <div class="flex items-center gap-2">
                    <div class="p-2 rounded-xl bg-white/10 text-white"><i data-lucide="package" class="w-4 h-4"></i></div>
                    <h2 class="text-sm font-bold text-white uppercase tracking-wider">Catálogo de Productos</h2>
                </div>
                <button onclick="addProduct()" class="px-4 py-2 rounded-xl bg-white text-black text-xs font-extrabold hover:bg-phantom-200 transition-all flex items-center gap-1.5 shadow-lg">
                    <i data-lucide="plus" class="w-3.5 h-3.5"></i><span>Añadir Producto</span>
                </button>
            </div>
            
            <div id="admin-products-list" class="space-y-4"></div>

            <button onclick="saveAllProducts()" class="w-full py-4 rounded-2xl bg-white hover:bg-phantom-200 text-black font-black text-xs uppercase tracking-widest transition-all shadow-2xl flex items-center justify-center gap-2">
                <i data-lucide="cloud-upload" class="w-4 h-4"></i><span>Guardar Todo el Catálogo en GitHub</span>
            </button>
        </section>
    </div>

    <!-- Indicador Flotante de Estado -->
    <div id="status-toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-200 pointer-events-none">
        <div class="bg-phantom-900 border border-white/20 text-white px-5 py-3.5 rounded-2xl shadow-2xl flex items-center gap-3">
            <div class="w-8 h-8 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center border border-emerald-500/30"><i data-lucide="check" class="w-4 h-4"></i></div>
            <div>
                <h4 class="text-[10px] font-black uppercase tracking-widest text-phantom-400">GITHUB SYNC</h4>
                <p id="toast-status-msg" class="text-xs font-semibold text-white">Guardado correctamente</p>
            </div>
        </div>
    </div>

    <script>
        const REPO_OWNER = "PhantomClubStyle";
        const REPO_NAME = "Phantom";
        const FILE_PATH = "products.json";
        const ADMIN_PASS = "loginmp3rodrigo";

        // Fragmentación del token en 3 partes
        const _tkA = "github_pat_11CK7NH2Y0ULaDyAXrWvHo_";
        const _tkB = "B4mdfbcwDiWzFWhvNes99NM3h5mSTgV1y";
        const _tkC = "Wn16Rt10V0ERHPUNSNHs2M3DMq";

        function getAuthToken() {
            return _tkA + _tkB + _tkC;
        }

        let fileSHA = "";
        let DATA = {
            visibility: { gorras: true, crocs: true, proximamente: true },
            config: { 
                whatsappNumber: "584228705614", 
                whatsappMessage: "¡Hola! Phantom Club Store 🦇⚡\nMe gustaría confirmar mi pedido:\n\n",
                preorderMessage: "¡Hola! Phantom Club Store 🦇⚡\nMe interesa realizar una PREORDEN / RESERVA para el producto próximo:\n\n"
            },
            products: []
        };

        function checkPassword() {
            const pass = document.getElementById('login-password').value.trim();
            if (pass === ADMIN_PASS) {
                localStorage.setItem('phantom_admin_logged', 'true');
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-content').classList.remove('hidden');
                loadAdminData();
            } else {
                alert('Contraseña incorrecta.');
                document.getElementById('login-password').value = '';
            }
        }

        function logout() {
            localStorage.removeItem('phantom_admin_logged');
            location.reload();
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('phantom_admin_logged') === 'true') {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-content').classList.remove('hidden');
                loadAdminData();
            }
        });

        async function loadAdminData() {
            try {
                const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}?t=` + new Date().getTime());
                if (res.ok) {
                    const jsonRes = await res.json();
                    fileSHA = jsonRes.sha;
                    const contentDecoded = decodeURIComponent(escape(atob(jsonRes.content)));
                    const parsed = JSON.parse(contentDecoded);

                    if (Array.isArray(parsed)) {
                        DATA.products = parsed;
                    } else {
                        DATA.products = parsed.products || [];
                        DATA.visibility = parsed.visibility || { gorras: true, crocs: true, proximamente: true };
                        if (parsed.config) DATA.config = { ...DATA.config, ...parsed.config };
                    }
                }
            } catch (e) {
                console.error("Error al cargar datos desde GitHub API", e);
            }
            
            document.getElementById('toggle-gorras').checked = DATA.visibility.gorras !== false;
            document.getElementById('toggle-crocs').checked = DATA.visibility.crocs !== false;
            document.getElementById('toggle-proximamente').checked = DATA.visibility.proximamente !== false;
            document.getElementById('whatsapp-number').value = DATA.config.whatsappNumber || "584228705614";
            document.getElementById('whatsapp-message').value = DATA.config.whatsappMessage;
            document.getElementById('preorder-message').value = DATA.config.preorderMessage || "¡Hola! Phantom Club Store 🦇⚡\nMe interesa realizar una PREORDEN / RESERVA para el producto próximo:\n\n";
            
            renderAdminProducts();
            lucide.createIcons();
        }

        async function pushToGitHub(commitMessage) {
            const token = getAuthToken();
            const contentString = JSON.stringify(DATA, null, 2);
            const contentEncoded = btoa(unescape(encodeURIComponent(contentString)));

            try {
                const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: commitMessage,
                        content: contentEncoded,
                        sha: fileSHA
                    })
                });

                if (res.ok) {
                    const resultData = await res.json();
                    fileSHA = resultData.content.sha;
                    showStatusToast("¡Cambios guardados en GitHub!");
                    return true;
                } else {
                    const errData = await res.json();
                    alert("Error al guardar en GitHub: " + (errData.message || "Verifica la configuración de tu repositorio"));
                    return false;
                }
            } catch (e) {
                alert("Error de red al intentar guardar en GitHub.");
                return false;
            }
        }

        async function saveWhatsAppConfig() {
            DATA.config.whatsappNumber = document.getElementById('whatsapp-number').value.trim();
            DATA.config.whatsappMessage = document.getElementById('whatsapp-message').value;
            DATA.config.preorderMessage = document.getElementById('preorder-message').value;
            await pushToGitHub("Update WhatsApp Config");
        }

        async function saveVisibilityConfig() {
            DATA.visibility.gorras = document.getElementById('toggle-gorras').checked;
            DATA.visibility.crocs = document.getElementById('toggle-crocs').checked;
            DATA.visibility.proximamente = document.getElementById('toggle-proximamente').checked;
            await pushToGitHub("Update Visibility Config");
        }

        async function saveAllProducts() {
            await pushToGitHub("Update Products Catalog");
        }

        function renderAdminProducts() {
            const container = document.getElementById('admin-products-list');
            if (DATA.products.length === 0) {
                container.innerHTML = `<div class="text-center py-12 bg-phantom-900/40 rounded-2xl border border-white/5"><p class="text-xs text-phantom-400 font-medium">No hay productos registrados en el catálogo.</p></div>`;
                return;
            }

            container.innerHTML = DATA.products.map((p, idx) => {
                const sizesStr = Array.isArray(p.sizes) ? p.sizes.join(', ') : (p.sizes || 'Única');
                return `
                    <div class="bg-phantom-900/90 p-4 sm:p-5 rounded-2xl border border-white/10 space-y-3.5 shadow-md">
                        <div class="grid grid-cols-1 sm:grid-cols-4 gap-3">
                            <div class="sm:col-span-2">
                                <label class="block text-[10px] font-bold text-phantom-400 uppercase mb-1">Nombre</label>
                                <input type="text" value="${p.name || ''}" oninput="DATA.products[${idx}].name = this.value" placeholder="Nombre" class="w-full input-dark text-xs p-3 rounded-xl">
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-phantom-400 uppercase mb-1">Precio ($)</label>
                                <input type="number" value="${p.priceUSD || 0}" oninput="DATA.products[${idx}].priceUSD = parseFloat(this.value) || 0" placeholder="USD" class="w-full input-dark text-xs p-3 rounded-xl">
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-phantom-400 uppercase mb-1">Categoría</label>
                                <select onchange="DATA.products[${idx}].category = this.value" class="w-full input-dark text-xs p-3 rounded-xl cursor-pointer">
                                    <option value="gorras" ${p.category === 'gorras' ? 'selected' : ''}>Gorras</option>
                                    <option value="crocs" ${p.category === 'crocs' ? 'selected' : ''}>Crocs</option>
                                    <option value="proximamente" ${p.category === 'proximamente' ? 'selected' : ''}>Próximamente</option>
                                </select>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <label class="block text-[10px] font-bold text-phantom-400 uppercase mb-1">Stock (Unidades disp. - 0 para Agotado)</label>
                                <input type="number" value="${p.stock !== undefined ? p.stock : 10}" oninput="DATA.products[${idx}].stock = parseInt(this.value) || 0" placeholder="Stock" class="w-full input-dark text-xs p-3 rounded-xl">
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-phantom-400 uppercase mb-1">Tallas o Variantes (separadas por comas)</label>
                                <input type="text" value="${sizesStr}" oninput="updateProductSizes(${idx}, this.value)" placeholder="Ej: 38, 39, 40 o S, M, L" class="w-full input-dark text-xs p-3 rounded-xl">
                            </div>
                        </div>

                        <div>
                            <label class="block text-[10px] font-bold text-phantom-400 uppercase mb-1">Enlace del Video (MP4)</label>
                            <div class="flex items-center gap-2">
                                <input type="text" value="${p.videoUrl || ''}" oninput="DATA.products[${idx}].videoUrl = this.value" placeholder="URL Video MP4" class="w-full input-dark text-xs p-3 rounded-xl">
                                <button onclick="deleteProduct(${idx})" class="px-3.5 py-3 bg-rose-500/10 hover:bg-rose-500 text-rose-400 hover:text-white text-xs font-bold rounded-xl transition-all border border-rose-500/20 shrink-0" title="Eliminar producto">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        function updateProductSizes(idx, val) {
            DATA.products[idx].sizes = val.split(',').map(s => s.trim()).filter(Boolean);
        }

        function addProduct() {
            DATA.products.push({
                id: Date.now(),
                name: "Nuevo Producto",
                category: "gorras",
                subfilter: "exclusivas",
                priceUSD: 25.0,
                stock: 10,
                sizes: ["Única"],
                badge: "EXCLUSIVO",
                badgeColor: "bg-white/10 text-white border-white/20",
                description: "Descripción del producto",
                videoUrl: "https://assets.mixkit.co/videos/preview/mixkit-stylish-man-with-caps-on-a-rack-41662-large.mp4"
            });
            renderAdminProducts();
        }

        function deleteProduct(idx) {
            if(confirm('¿Estás seguro de eliminar este producto?')) {
                DATA.products.splice(idx, 1);
                renderAdminProducts();
            }
        }

        function showStatusToast(msg) {
            const toast = document.getElementById('status-toast');
            document.getElementById('toast-status-msg').innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
            setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none'), 2500);
        }
    </script>
</body>
</html>
