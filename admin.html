<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - PHANTOM CLUB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        phantom: {
                            950: '#09090b',
                            900: '#121215',
                            800: '#18181b',
                            700: '#27272a',
                            600: '#3f3f46',
                            500: '#52525b',
                            400: '#a1a1aa',
                            300: '#d4d4d8',
                            200: '#e4e4e7',
                            100: '#f4f4f5'
                        }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #f4f4f5; }
        .glass-panel { background: rgba(18, 18, 21, 0.85); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="bg-phantom-950 text-phantom-100 min-h-screen p-4 sm:p-8">

    <div class="max-w-4xl mx-auto space-y-8">
        <header class="flex items-center justify-between bg-phantom-900/60 p-6 rounded-3xl border border-white/10 backdrop-blur-xl">
            <div>
                <span class="text-[10px] font-black uppercase tracking-widest text-phantom-400 block mb-1">Panel de Control</span>
                <h1 class="text-2xl font-black text-white">PHANTOM CLUB ADMIN</h1>
            </div>
            <a href="index.html" target="_blank" class="px-4 py-2.5 rounded-xl bg-white/10 hover:bg-white hover:text-black text-white text-xs font-bold transition-all border border-white/15">Ver Tienda ⚡</a>
        </header>

        <!-- Configuración de WhatsApp y Visibilidad de Categorías -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="glass-panel p-6 rounded-3xl space-y-4">
                <h3 class="text-sm font-bold text-white uppercase tracking-wider flex items-center gap-2">
                    <i data-lucide="eye" class="w-4 h-4"></i> Visibilidad de Categorías
                </h3>
                <div class="space-y-3">
                    <label class="flex items-center justify-between p-3 rounded-xl bg-phantom-900/80 border border-white/5 cursor-pointer">
                        <span class="text-sm font-medium">Categoría Gorras</span>
                        <input type="checkbox" id="toggle-gorras" onchange="updateVisibility()" class="w-4 h-4 accent-white">
                    </label>
                    <label class="flex items-center justify-between p-3 rounded-xl bg-phantom-900/80 border border-white/5 cursor-pointer">
                        <span class="text-sm font-medium">Categoría Crocs</span>
                        <input type="checkbox" id="toggle-crocs" onchange="updateVisibility()" class="w-4 h-4 accent-white">
                    </label>
                    <label class="flex items-center justify-between p-3 rounded-xl bg-phantom-900/80 border border-white/5 cursor-pointer">
                        <span class="text-sm font-medium">Categoría Próximamente</span>
                        <input type="checkbox" id="toggle-proximamente" onchange="updateVisibility()" class="w-4 h-4 accent-white">
                    </label>
                </div>
            </div>

            <div class="glass-panel p-6 rounded-3xl space-y-4">
                <h3 class="text-sm font-bold text-white uppercase tracking-wider flex items-center gap-2">
                    <i data-lucide="message-circle" class="w-4 h-4"></i> Configuración WhatsApp
                </h3>
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-semibold text-phantom-400 mb-1">Número de WhatsApp (con código país):</label>
                        <input type="text" id="whatsapp-number" placeholder="584128705612" class="w-full bg-phantom-900 text-sm text-white px-3 py-2.5 rounded-xl border border-white/10 focus:outline-none focus:border-white/40">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-phantom-400 mb-1">Mensaje pred. de pedido:</label>
                        <textarea id="whatsapp-message" rows="2" class="w-full bg-phantom-900 text-sm text-white px-3 py-2 rounded-xl border border-white/10 focus:outline-none focus:border-white/40"></textarea>
                    </div>
                    <button onclick="saveConfig()" class="w-full py-2.5 rounded-xl bg-white text-black font-bold text-xs hover:bg-phantom-200 transition-all">Guardar Configuración</button>
                </div>
            </div>
        </div>

        <!-- Generador de Código JSON para Descargar -->
        <div class="glass-panel p-6 rounded-3xl space-y-4">
            <div class="flex items-center justify-between">
                <h3 class="text-sm font-bold text-white uppercase tracking-wider">Gestión de Productos (`products.json`)</h3>
                <button onclick="addProduct()" class="px-4 py-2 rounded-xl bg-white text-black text-xs font-bold hover:bg-phantom-200 transition-all">+ Nuevo Producto</button>
            </div>
            
            <div id="admin-products-list" class="space-y-3"></div>

            <div class="pt-4 border-t border-white/15 flex gap-4">
                <button onclick="exportJSON()" class="flex-1 py-3.5 rounded-xl bg-white hover:bg-phantom-200 text-black font-extrabold text-sm transition-all shadow-xl">
                    📥 Descargar products.json actualizado
                </button>
            </div>
        </div>
    </div>

    <script>
        let DATA = {
            visibility: { gorras: true, crocs: true, proximamente: true },
            config: { whatsappNumber: "584128705612", whatsappMessage: "¡Hola! Phantom Club Store 🦇⚡\nMe gustaría confirmar mi pedido:\n\n" },
            products: []
        };

        async function loadAdminData() {
            try {
                const res = await fetch('products.json?t=' + new Date().getTime());
                if (res.ok) {
                    const parsed = await res.json();
                    if (Array.isArray(parsed)) {
                        DATA.products = parsed;
                    } else {
                        DATA.products = parsed.products || [];
                        DATA.visibility = parsed.visibility || { gorras: true, crocs: true, proximamente: true };
                        if (parsed.config) DATA.config = { ...DATA.config, ...parsed.config };
                    }
                }
            } catch (e) {
                DATA.products = [];
            }
            
            document.getElementById('toggle-gorras').checked = DATA.visibility.gorras !== false;
            document.getElementById('toggle-crocs').checked = DATA.visibility.crocs !== false;
            document.getElementById('toggle-proximamente').checked = DATA.visibility.proximamente !== false;
            document.getElementById('whatsapp-number').value = DATA.config.whatsappNumber;
            document.getElementById('whatsapp-message').value = DATA.config.whatsappMessage;
            
            renderAdminProducts();
            lucide.createIcons();
        }

        function updateVisibility() {
            DATA.visibility.gorras = document.getElementById('toggle-gorras').checked;
            DATA.visibility.crocs = document.getElementById('toggle-crocs').checked;
            DATA.visibility.proximamente = document.getElementById('toggle-proximamente').checked;
        }

        function saveConfig() {
            DATA.config.whatsappNumber = document.getElementById('whatsapp-number').value.trim();
            DATA.config.whatsappMessage = document.getElementById('whatsapp-message').value;
            alert('¡Configuración de WhatsApp guardada! Recuerda descargar y subir tu products.json a GitHub.');
        }

        function renderAdminProducts() {
            const container = document.getElementById('admin-products-list');
            if (DATA.products.length === 0) {
                container.innerHTML = `<p class="text-xs text-phantom-500 text-center py-6">No hay productos registrados.</p>`;
                return;
            }

            container.innerHTML = DATA.products.map((p, idx) => `
                <div class="bg-phantom-900/80 p-4 rounded-2xl border border-white/5 space-y-3">
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <input type="text" value="${p.name}" oninput="DATA.products[${idx}].name = this.value" placeholder="Nombre" class="bg-phantom-950 text-xs text-white p-2.5 rounded-xl border border-white/10">
                        <input type="number" value="${p.priceUSD}" oninput="DATA.products[${idx}].priceUSD = parseFloat(this.value) || 0" placeholder="Precio USD" class="bg-phantom-950 text-xs text-white p-2.5 rounded-xl border border-white/10">
                        <select onchange="DATA.products[${idx}].category = this.value" class="bg-phantom-950 text-xs text-white p-2.5 rounded-xl border border-white/10">
                            <option value="gorras" ${p.category === 'gorras' ? 'selected' : ''}>Gorras</option>
                            <option value="crocs" ${p.category === 'crocs' ? 'selected' : ''}>Crocs</option>
                            <option value="proximamente" ${p.category === 'proximamente' ? 'selected' : ''}>Próximamente</option>
                        </select>
                    </div>
                    <div class="flex justify-between items-center">
                        <input type="text" value="${p.videoUrl}" oninput="DATA.products[${idx}].videoUrl = this.value" placeholder="URL Video MP4" class="w-full bg-phantom-950 text-xs text-white p-2.5 rounded-xl border border-white/10 mr-3">
                        <button onclick="deleteProduct(${idx})" class="px-3 py-2 bg-rose-500/20 text-rose-400 hover:bg-rose-500 hover:text-white text-xs font-bold rounded-xl transition-all">Eliminar</button>
                    </div>
                </div>
            `).join('');
        }

        function addProduct() {
            DATA.products.push({
                id: Date.now(),
                name: "Nuevo Producto",
                category: "gorras",
                subfilter: "exclusivas",
                priceUSD: 25.0,
                stock: 10,
                sizes: ["Única"],
                badge: "EXCLUSIVO",
                badgeColor: "bg-white/10 text-white border-white/20",
                description: "Descripción de prueba",
                videoUrl: "https://assets.mixkit.co/videos/preview/mixkit-stylish-man-with-caps-on-a-rack-41662-large.mp4"
            });
            renderAdminProducts();
        }

        function deleteProduct(idx) {
            DATA.products.splice(idx, 1);
            renderAdminProducts();
        }

        function exportJSON() {
            updateVisibility();
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(DATA, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", "products.json");
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }

        document.addEventListener('DOMContentLoaded', loadAdminData);
    </script>
</body>
</html>
