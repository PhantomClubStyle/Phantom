<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - PHANTOM CLUB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #f4f4f5; }
        .glass-panel { background: rgba(18, 18, 21, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="bg-phantom-950 text-phantom-100 min-h-screen flex flex-col">

    <!-- Pantalla de Login con Contraseña -->
    <div id="login-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-black/90 p-4">
        <div class="glass-panel p-8 rounded-3xl max-w-sm w-full border border-white/20 shadow-2xl text-center">
            <h2 class="text-xl font-black text-white mb-1">Acceso Admin</h2>
            <p class="text-xs text-phantom-400 mb-6">Ingresa tu contraseña para administrar la tienda</p>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <input type="password" id="admin-pass" placeholder="Contraseña" required
                    class="w-full bg-phantom-900 text-sm text-white placeholder-phantom-500 px-4 py-3 rounded-xl border border-white/10 focus:outline-none focus:border-white/40 text-center">
                <button type="submit" class="w-full py-3 rounded-xl bg-white text-black font-extrabold hover:bg-phantom-200 transition-all shadow-lg">Entrar</button>
            </form>
            <a href="https://phantomclubstyle.github.io/Phantom/" class="inline-block mt-6 text-xs text-phantom-400 hover:text-white">← Volver a la Tienda</a>
        </div>
    </div>

    <!-- Panel de Administración -->
    <div id="admin-dashboard" class="hidden flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full">
        <div class="flex items-center justify-between pb-6 border-b border-white/10 mb-8">
            <h1 class="text-xl font-black text-white tracking-wide">PHANTOM ADMIN</h1>
            <div class="flex items-center gap-3">
                <button onclick="saveAllToGitHub()" id="save-btn" class="px-5 py-2.5 rounded-xl bg-emerald-500 text-black text-xs font-black hover:bg-emerald-400 transition-all shadow-lg">Guardar Cambios Globales</button>
                <button onclick="addNewProduct()" class="px-4 py-2.5 rounded-xl bg-phantom-900 border border-white/10 text-white text-xs font-extrabold">+ Nuevo</button>
                <a href="https://phantomclubstyle.github.io/Phantom/" target="_blank" class="px-4 py-2.5 rounded-xl bg-phantom-900 border border-white/10 text-xs font-semibold text-white">Ver Tienda ↗</a>
            </div>
        </div>
        <div id="admin-products-list" class="space-y-4"></div>
    </div>

    <script>
        // =========================================================================
        // CONFIGURACIÓN OBLIGATORIA (Rellena estas 2 comillas antes de guardar)
        // =========================================================================
        const ADMIN_PASSWORD = "loginmp3rodrigo"; // <-- Pon tu contraseña aquí
        const GITHUB_TOKEN = "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";     // <-- Pon tu token nuevo aquí
        const REPO_OWNER = "PhantomClubStyle";
        const REPO_NAME = "Phantom";
        // =========================================================================

        let PRODUCTS = [];
        let fileSha = "";

        function handleLogin(e) {
            e.preventDefault();
            const pass = document.getElementById('admin-pass').value.trim();
            if (pass === ADMIN_PASSWORD) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
                loadAdminProducts();
            } else {
                alert('Contraseña incorrecta');
            }
        }

        async function loadAdminProducts() {
            try {
                const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/products.json`, {
                    headers: { 
                        "Authorization": `Bearer ${GITHUB_TOKEN}`,
                        "Accept": "application/vnd.github.v3+json"
                    }
                });
                
                if (!res.ok) {
                    const errData = await res.json();
                    throw new Error(errData.message || 'Error de conexión');
                }

                const data = await res.json();
                fileSha = data.sha;
                
                const binaryString = atob(data.content.replace(/\n/g, ''));
                const bytes = Uint8Array.from(binaryString, char => char.charCodeAt(0));
                const jsonText = new TextDecoder().decode(bytes);
                
                PRODUCTS = JSON.parse(jsonText);
                renderList();
            } catch (err) {
                alert('Error al conectar con GitHub: ' + err.message + '\n\nRevisa que el token en GITHUB_TOKEN sea válido y tenga permisos "repo".');
            }
        }

        function renderList() {
            const container = document.getElementById('admin-products-list');
            container.innerHTML = PRODUCTS.map((p, idx) => `
                <div class="glass-panel p-5 rounded-2xl flex flex-col md:flex-row items-center gap-4 justify-between">
                    <div class="flex items-center gap-4 w-full md:w-auto flex-1">
                        <div class="w-full">
                            <label class="block text-[10px] text-phantom-400 mb-1">Nombre del Producto</label>
                            <input type="text" id="name-${idx}" value="${p.name}" class="bg-phantom-900 text-sm font-bold text-white px-3 py-1.5 rounded-lg border border-white/10 w-full mb-2">
                            <label class="block text-[10px] text-phantom-400 mb-1">URL de Video o Imagen</label>
                            <input type="text" id="video-${idx}" value="${p.videoUrl || p.imageUrl}" class="bg-phantom-900 text-xs text-phantom-300 px-3 py-1 rounded-lg border border-white/10 w-full">
                        </div>
                    </div>
                    <div class="flex flex-wrap items-center gap-3 w-full md:w-auto justify-end">
                        <div>
                            <label class="block text-[10px] text-phantom-400">Precio ($)</label>
                            <input type="number" step="0.01" id="price-${idx}" value="${p.priceUSD}" class="bg-phantom-900 text-sm font-bold text-white px-3 py-1.5 rounded-xl border border-white/10 w-24">
                        </div>
                        <div>
                            <label class="block text-[10px] text-phantom-400">Stock</label>
                            <input type="number" id="stock-${idx}" value="${p.stock}" class="bg-phantom-900 text-sm font-bold text-white px-3 py-1.5 rounded-xl border border-white/10 w-20">
                        </div>
                        <div>
                            <label class="block text-[10px] text-phantom-400">Categoría</label>
                            <select id="cat-${idx}" class="bg-phantom-900 text-xs text-white px-3 py-2 rounded-xl border border-white/10">
                                <option value="gorras" ${p.category==='gorras'?'selected':''}>Gorras</option>
                                <option value="crocs" ${p.category==='crocs'?'selected':''}>Crocs</option>
                                <option value="proximamente" ${p.category==='proximamente'?'selected':''}>Próximamente</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] text-phantom-400">Estado</label>
                            <select id="sub-${idx}" class="bg-phantom-900 text-xs text-white px-3 py-2 rounded-xl border border-white/10">
                                <option value="exclusivas" ${p.subfilter==='exclusivas'?'selected':''}>Exclusiva</option>
                                <option value="ofertas" ${p.subfilter==='ofertas'?'selected':''}>Oferta</option>
                                <option value="todas" ${p.subfilter==='todas'?'selected':''}>Normal</option>
                            </select>
                        </div>
                        <button onclick="deleteProduct(${idx})" class="p-2.5 bg-phantom-900 text-rose-400 hover:bg-rose-500 hover:text-white rounded-xl border border-white/10 mt-4">🗑️</button>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        async function saveAllToGitHub() {
            PRODUCTS.forEach((p, idx) => {
                p.name = document.getElementById(`name-${idx}`).value;
                const urlVal = document.getElementById(`video-${idx}`).value;
                p.videoUrl = urlVal;
                p.imageUrl = urlVal;
                p.priceUSD = parseFloat(document.getElementById(`price-${idx}`).value);
                p.stock = parseInt(document.getElementById(`stock-${idx}`).value);
                p.category = document.getElementById(`cat-${idx}`).value;
                p.subfilter = document.getElementById(`sub-${idx}`).value;
                p.badge = p.stock === 0 ? "Agotado" : (p.subfilter === 'exclusivas' ? "Exclusiva" : "Disponible");
                p.badgeColor = p.stock === 0 ? "bg-phantom-800 text-phantom-400 border-white/10" : "bg-white/10 text-white border-white/30";
            });

            const btn = document.getElementById('save-btn');
            btn.innerText = "Guardando en GitHub...";

            try {
                const jsonString = JSON.stringify(PRODUCTS, null, 4);
                const bytes = new TextEncoder().encode(jsonString);
                const binaryString = Array.from(bytes, byte => String.fromCharCode(byte)).join('');
                const contentEncoded = btoa(binaryString);

                const putRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/products.json`, {
                    method: 'PUT',
                    headers: {
                        "Authorization": `Bearer ${GITHUB_TOKEN}`,
                        "Content-Type": "application/json",
                        "Accept": "application/vnd.github.v3+json"
                    },
                    body: JSON.stringify({
                        message: "Actualización de catálogo desde Phantom Admin",
                        content: contentEncoded,
                        sha: fileSha
                    })
                });

                const resData = await putRes.json();

                if (putRes.ok) {
                    fileSha = resData.content.sha;
                    alert('¡Cambios guardados con éxito en GitHub! Se verán en la tienda en unos segundos.');
                } else {
                    throw new Error(resData.message || 'Error al guardar');
                }
            } catch (err) {
                alert('Hubo un error al guardar en GitHub: ' + err.message);
            }
            btn.innerText = "Guardar Cambios Globales";
        }

        function addNewProduct() {
            const newId = PRODUCTS.length > 0 ? Math.max(...PRODUCTS.map(p => p.id)) + 1 : 1;
            PRODUCTS.push({
                id: newId,
                name: "Nuevo Artículo Phantom",
                category: "gorras",
                subfilter: "todas",
                priceUSD: 30.00,
                badge: "Disponible",
                badgeColor: "bg-phantom-800 text-phantom-200 border-white/20",
                videoUrl: "https://assets.mixkit.co/videos/preview/mixkit-stylish-man-with-cap-and-sunglasses-42171-large.mp4",
                imageUrl: "https://placehold.co/600x600/18181b/ffffff?text=Nuevo",
                description: "Descripción del artículo.",
                sizes: ["Única"],
                stock: 10,
                specs: ["Alta calidad"]
            });
            renderList();
        }

        function deleteProduct(idx) {
            if(confirm('¿Eliminar producto?')) {
                PRODUCTS.splice(idx, 1);
                renderList();
            }
        }
    </script>
</body>
</html>
