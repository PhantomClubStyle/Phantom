<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhantomClub | Catálogo Exclusivo</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #070709; color: #f3f4f6; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .cat-btn.active {
            background: linear-gradient(135deg, #9333ea, #6b21a8);
            border-color: rgba(168, 85, 247, 0.5);
            box-shadow: 0 0 20px rgba(147, 51, 234, 0.4);
            color: #fff;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .product-card { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .glass { background: rgba(18, 18, 24, 0.75); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="antialiased pb-28 selection:bg-purple-600 selection:text-white">

    <!-- HEADER / NAVEGACIÓN MÓVIL -->
    <header class="sticky top-0 z-40 glass border-b border-white/10 px-4 py-3.5 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-xl bg-purple-600 flex items-center justify-center shadow-lg shadow-purple-600/30 font-extrabold text-sm text-white">P</div>
            <span class="text-lg font-extrabold tracking-tighter bg-gradient-to-r from-white via-gray-200 to-purple-400 bg-clip-text text-transparent">
                PHANTOM<span class="text-purple-500">CLUB</span>
            </span>
        </div>
        <div class="flex items-center gap-2.5">
            <!-- Tasa BCV -->
            <div class="text-[10px] bg-white/5 border border-white/10 px-2.5 py-1.5 rounded-full text-gray-300 flex items-center gap-1.5 shadow-inner">
                <i class="fa-solid fa-arrows-rotate animate-spin text-purple-400" id="bcv-spinner"></i>
                <span>BCV: <strong id="bcv-val" class="text-white font-bold">Cargando...</strong></span>
            </div>
            <!-- Carrito -->
            <button onclick="toggleCart()" class="relative p-2.5 bg-white/5 border border-white/10 rounded-full hover:bg-white/10 transition active:scale-95">
                <i class="fa-solid fa-bag-shopping text-purple-400 text-base"></i>
                <span id="cart-counter" class="absolute -top-1 -right-1 bg-purple-600 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center border-2 border-[#070709] scale-0 transition-transform">0</span>
            </button>
        </div>
    </header>

    <!-- SECCIÓN HERO -->
    <section class="px-4 pt-5 pb-2">
        <div class="relative overflow-hidden rounded-3xl bg-gradient-to-br from-purple-950/60 via-zinc-900/80 to-black p-5 border border-white/10 shadow-2xl">
            <div class="absolute -right-8 -bottom-8 w-36 h-36 bg-purple-600/20 rounded-full blur-2xl pointer-events-none"></div>
            <span class="inline-block text-[10px] font-extrabold tracking-widest uppercase bg-purple-500/20 text-purple-300 px-3 py-1 rounded-full mb-2.5 border border-purple-500/30">Exclusividad Urbana</span>
            <h1 class="text-xl font-extrabold tracking-tight mb-1 text-white">Diseñado para destacar.</h1>
            <p class="text-[11px] text-gray-400 mb-3.5 leading-relaxed">Gorras, Crocs y colecciones limitadas al alcance de un clic.</p>
            
            <!-- BUSCADOR -->
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                <input type="text" id="search-input" oninput="filterProducts()" placeholder="Busca gorras, crocs o ediciones..." class="w-full bg-black/50 border border-white/10 rounded-2xl pl-10 pr-4 py-2.5 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-purple-500 transition">
            </div>
        </div>
    </section>

    <!-- BOTONES DE CATEGORÍAS CON DISEÑOS DE GORRA Y CROCS MUY CURRADOS -->
    <section class="px-4 py-2">
        <div class="flex gap-2.5 overflow-x-auto no-scrollbar pb-2 pt-1">
            <!-- Botón Todo -->
            <button onclick="setCategory('all')" class="cat-btn active flex items-center gap-2.5 px-4 py-2.5 rounded-2xl bg-white/5 border border-white/10 text-xs font-semibold whitespace-nowrap transition active:scale-95">
                <i class="fa-solid fa-fire text-purple-400 text-sm"></i> Todo
            </button>
            
            <!-- Botón Gorras (Silueta Vectorial de Gorra Ajustada y Detallada) -->
            <button onclick="setCategory('gorras')" class="cat-btn flex items-center gap-2.5 px-4 py-2.5 rounded-2xl bg-white/5 border border-white/10 text-xs font-semibold whitespace-nowrap transition active:scale-95 group">
                <svg class="w-5 h-5 text-purple-400 group-hover:scale-110 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round
