<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHANTOM CLUB Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        phantom: { 950: '#09090b', 900: '#121215', 800: '#18181b', 700: '#27272a', 600: '#3f3f46', 500: '#52525b', 400: '#a1a1aa', 300: '#d4d4d8', 200: '#e4e4e7', 100: '#f4f4f5' }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #f4f4f5; overflow-x: hidden; }
        .glass-panel { background: rgba(18, 18, 21, 0.75); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glow-white { box-shadow: 0 0 25px -5px rgba(255, 255, 255, 0.15); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .product-card { transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
        .product-card:hover { transform: translateY(-6px); box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body class="bg-phantom-950 text-phantom-100 min-h-screen flex flex-col selection:bg-white selection:text-black">

    <header class="sticky top-0 z-50 glass-panel border-b border-white/10 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
            <!-- Logo Phantom Personalizado -->
            <a href="index.html" class="flex items-center gap-3 group shrink-0">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-white/20 to-phantom-900 border border-white/30 flex items-center justify-center group-hover:border-white transition-all duration-300 glow-white">
                    <svg class="w-6 h-6 text-white transform group-hover:scale-110 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 2C8 2 5 6 5 10c0 3 2 5 3 7l4 3 4-3c1-2 3-4 3-7 0-4-3-8-7-8z" />
                        <circle cx="9.5" cy="9.5" r="1.5" fill="currentColor"/>
                        <circle cx="14.5" cy="9.5" r="1.5" fill="currentColor"/>
                        <path d="M10 14h4" stroke-linecap="round"/>
                    </svg>
                </div>
                <div>
                    <span class="text-base sm:text-lg font-black tracking-widest text-white uppercase block leading-none">PHANTOM CLUB</span>
                    <span class="text-[10px] sm:text-xs font-bold tracking-[0.2em] text-phantom-400 uppercase block mt-0.5">STORE OFICIAL</span>
                </div>
            </a>

            <!-- Buscador -->
            <div class="hidden md:flex items-center relative flex-1 max-w-md mx-4">
                <span class="absolute left-3.5 text-phantom-400 pointer-events-none"><i data-lucide="search" class="w-4 h-4"></i></span>
                <input type="text" id="desktop-search-input" placeholder="Buscar productos..." 
                    class="w-full bg-phantom-900/90 text-sm text-white placeholder-phantom-500 pl-10 pr-4 py-2.5 rounded-xl border border-white/10 focus:outline-none focus:border-white/40">
            </div>

            <div class="flex items-center gap-3 shrink-0">
                <div class="hidden sm:flex items-center gap-2 bg-phantom-900/80 border border-white/10 px-3.5 py-2 rounded-xl text-xs">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span class="text-phantom-400 font-medium">BCV:</span>
                    <span id="header-bcv-rate" class="font-bold text-white">Cargando...</span>
                </div>
                <button onclick="toggleCart()" class="relative p-2.5 rounded-xl bg-phantom-900/80 border border-white/10 hover:border-white/30 text-white transition-all flex items-center gap-2 group">
                    <i data-lucide="shopping-bag" class="w-5 h-5 text-phantom-200 group-hover:scale-110 transition-transform"></i>
                    <span class="hidden sm:inline text-xs font-semibold pr-1">Carrito</span>
                    <span id="cart-badge" class="absolute -top-1.5 -right-1.5 bg-white text-black text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center shadow-lg transition-transform scale-0">0</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        <!-- Categorías -->
        <section class="mb-8">
            <div class="flex flex-col lg:flex-row gap-4 items-stretch lg:items-center justify-between bg-phantom-900/60 p-3 rounded-2xl border border-white/10 backdrop-blur-xl">
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 w-full lg:w-auto" id="category-buttons">
                    <button onclick="setCategory('todo')" class="cat-btn px-4 py-3 rounded-xl text-xs sm:text-sm font-bold flex items-center justify-center gap-2 bg-white text-black shadow-lg" data-category="todo">
                        <i data-lucide="layout-grid" class="w-4 h-4"></i> Todo
                    </button>
                    <!-- Gorras con SVG Táctico -->
                    <button onclick="setCategory('gorras')" class="cat-btn px-4 py-3 rounded-xl text-xs sm:text-sm font-semibold flex items-center justify-center gap-2 bg-phantom-800/80 text-phantom-300 hover:text-white border border-white/5" data-category="gorras">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M2 12h20M12 4a8 8 0 0 0-8 8v2h16v-2a8 8 0 0 0-8-8zM17 14v4a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2v-4"/>
                        </svg> Gorras
                    </button>
                    <button onclick="setCategory('crocs')" class="cat-btn px-4 py-3 rounded-xl text-xs sm:text-sm font-semibold flex items-center justify-center gap-2 bg-phantom-800/80 text-phantom-300 hover:text-white border border-white/5" data-category="crocs">
                        <svg class="w-5 h-4" viewBox="0 0 240 130" fill="currentColor">
                            <path d="M 215 35 C 190 35 185 55 160 55 C 135 55 130 35 105 35 C 70 35 30 50 15 80 C 5 95 10 115 35 120 C 80 125 150 125 190 110 C 215 100 230 75 225 55 C 223 45 220 35 215 35 Z"/>
                            <circle cx="70" cy="65" r="12" fill="#18181b"/><circle cx="105" cy="65" r="12" fill="#18181b"/>
                        </svg> Crocs
                    </button>
                    <button onclick="setCategory('proximamente')" class="cat-btn px-4 py-3 rounded-xl text-xs sm:text-sm font-semibold flex items-center justify-center gap-2 bg-phantom-800/80 text-phantom-300 hover:text-white border border-white/5" data-category="proximamente">
                        <i data-lucide="clock" class="w-4 h-4"></i> Próximamente
                    </button>
                </div>
            </div>
        </section>

        <!-- Grid de Productos -->
        <section class="mb-16">
            <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            <div id="empty-state" class="hidden text-center py-20 bg-phantom-900/40 rounded-3xl border border-white/5">
                <h3 class="text-lg font-bold text-white mb-1">No hay productos disponibles</h3>
                <p class="text-sm text-phantom-400">Prueba cambiando de categoría o revisa el panel de administración.</p>
            </div>
        </section>
    </main>

    <!-- Carrito -->
    <div id="cart-drawer" class="fixed inset-0 z-50 overflow-hidden pointer-events-none transition-all duration-300">
        <div id="cart-backdrop" onclick="toggleCart()" class="absolute inset-0 bg-black/80 backdrop-blur-md opacity-0 transition-opacity pointer-events-none"></div>
        <div id="cart-panel" class="absolute inset-y-0 right-0 max-w-md w-full bg-phantom-950 border-l border-white/10 shadow-2xl flex flex-col transform translate-x-full transition-transform duration-300 pointer-events-auto">
            <div class="p-6 border-b border-white/10 flex items-center justify-between bg-phantom-900/80">
                <h2 class="text-lg font-bold text-white">Tu Carrito</h2>
                <button onclick="toggleCart()" class="p-2 rounded-xl bg-phantom-800 text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div id="cart-items-container" class="flex-1 overflow-y-auto p-6 space-y-4"></div>
            <div class="p-6 border-t border-white/10 bg-phantom-900/80 space-y-4">
                <div class="flex justify-between items-end">
                    <span class="text-base font-bold text-white">Total:</span>
                    <div class="text-right">
                        <div class="text-2xl font-black text-white" id="cart-total-usd">$0.00</div>
                        <div class="text-xs text-phantom-400" id="cart-total-ves">Bs. 0.00</div>
                    </div>
                </div>
                <button onclick="checkoutWhatsApp()" class="w-full py-4 rounded-xl bg-white hover:bg-phantom-200 text-black font-extrabold transition-all shadow-xl flex items-center justify-center gap-2">
                    <i data-lucide="message-circle" class="w-5 h-5"></i> Completar Pedido por WhatsApp
                </button>
            </div>
        </div>
    </div>

    <!-- Script de la tienda -->
    <script>
        let BCV_RATE = 852.42;
        let products = [];
        let cart = [];
        let currentCategory = 'todo';
        let searchQuery = '';

        async function initStore() {
            try {
                const res = await fetch('https://ve.dolarapi.com/v1/dolares/bcv');
                const data = await res.json();
                if (data && data.promedio) BCV_RATE = parseFloat(data.promedio);
            } catch (e) { console.log('Tasa respaldo BCV'); }

            document.getElementById('header-bcv-rate').innerText = `Bs. ${BCV_RATE.toFixed(2)}`;
            
            // Cargar productos de localStorage o usar datos por defecto
            const saved = localStorage.getItem('phantom_products');
            if (saved) {
                products = JSON.parse(saved);
            } else {
                products = [
                    { id: 1, name: "Gorra Phantom Steel Edition", category: "gorras", subfilter: "exclusivas", priceUSD: 35.00, badge: "Exclusiva", badgeColor: "bg-white/10 text-white border-white/30", videoUrl: "https://assets.mixkit.co/videos/preview/mixkit-stylish-man-with-cap-and-sunglasses-42171-large.mp4", imageUrl: "https://placehold.co/600x600/18181b/ffffff?text=Gorra+Steel", description: "Gorra trucker de alta gama con bordado 3D.", sizes: ["Única"], stock: 8, specs: ["100% Algodón", "Edición limitada"] }
                ];
                localStorage.setItem('phantom_products', JSON.stringify(products));
            }
            renderProducts();
        }

        function setCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if(btn.dataset.category === cat) {
                    btn.className = "cat-btn px-4 py-3 rounded-xl text-xs sm:text-sm font-bold flex items-center justify-center gap-2 bg-white text-black shadow-lg";
                } else {
                    btn.className = "cat-btn px-4 py-3 rounded-xl text-xs sm:text-sm font-semibold flex items-center justify-center gap-2 bg-phantom-800/80 text-phantom-300 hover:text-white border border-white/5";
                }
            });
            renderProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('product-grid');
            const empty = document.getElementById('empty-state');
            const filtered = products.filter(p => currentCategory === 'todo' || p.category === currentCategory);

            if(filtered.length === 0) {
                grid.innerHTML = '';
                empty.classList.remove('hidden');
                return;
            }
            empty.classList.add('hidden');

            grid.innerHTML = filtered.map(p => {
                const ves = (p.priceUSD * BCV_RATE).toLocaleString('es-VE', {minimumFractionDigits: 2});
                return `
                    <div class="product-card group bg-phantom-900/60 rounded-3xl overflow-hidden border border-white/10 flex flex-col justify-between shadow-xl">
                        <div class="relative w-full h-64 bg-black overflow-hidden">
                            <video autoplay muted loop playsinline class="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-opacity">
                                <source src="${p.videoUrl}" type="video/mp4">
                            </video>
                            <div class="absolute top-4 left-4"><span class="px-3 py-1 rounded-full text-[11px] font-bold border ${p.badgeColor}">${p.badge}</span></div>
                        </div>
                        <div class="p-6 flex flex-col flex-grow justify-between">
                            <div>
                                <span class="text-[10px] font-black uppercase text-phantom-400 block mb-1">${p.category}</span>
                                <h3 class="text-base font-bold text-white mb-2">${p.name}</h3>
                                <p class="text-xs text-phantom-400 line-clamp-2 mb-4">${p.description}</p>
                            </div>
                            <div class="pt-4 border-t border-white/10 flex items-end justify-between">
                                <div>
                                    <div class="text-2xl font-black text-white">$${p.priceUSD.toFixed(2)}</div>
                                    <div class="text-xs text-phantom-400">Bs. ${ves}</div>
                                </div>
                                <button onclick="addToCart(${p.id})" ${p.stock === 0 ? 'disabled' : ''} class="px-4 py-2 rounded-xl ${p.stock > 0 ? 'bg-white text-black font-bold hover:bg-phantom-200' : 'bg-phantom-800 text-phantom-500 cursor-not-allowed'} text-xs transition-all">
                                    ${p.stock > 0 ? 'Comprar' : 'Agotado'}
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        function toggleCart() {
            const drawer = document.getElementById('cart-drawer');
            drawer.classList.toggle('pointer-events-none');
            document.getElementById('cart-panel').classList.toggle('translate-x-full');
            document.getElementById('cart-backdrop').classList.toggle('opacity-0');
        }

        function addToCart(id) {
            const p = products.find(prod => prod.id === id);
            if(!p || p.stock === 0) return;
            cart.push({ ...p, quantity: 1, size: p.sizes ? p.sizes[0] : 'Única' });
            updateCartUI();
            toggleCart();
        }

        function updateCartUI() {
            const container = document.getElementById('cart-items-container');
            const badge = document.getElementById('cart-badge');
            badge.innerText = cart.length;
            badge.classList.toggle('scale-0', cart.length === 0);
            badge.classList.toggle('scale-100', cart.length > 0);

            if(cart.length === 0) {
                container.innerHTML = `<p class="text-center text-phantom-400 py-10 text-xs">Tu carrito está vacío</p>`;
                document.getElementById('cart-total-usd').innerText = '$0.00';
                document.getElementById('cart-total-ves').innerText = 'Bs. 0.00';
                return;
            }

            let totalUSD = 0;
            container.innerHTML = cart.map((item, idx) => {
                totalUSD += item.priceUSD;
                return `<div class="flex justify-between items-center bg-phantom-900 p-3 rounded-xl border border-white/10 text-xs">
                    <div><span class="font-bold text-white">${item.name}</span><br><span class="text-phantom-400">$${item.priceUSD.toFixed(2)}</span></div>
                    <button onclick="cart.splice(${idx}, 1); updateCartUI();" class="text-rose-400">Eliminar</button>
                </div>`;
            }).join('');

            document.getElementById('cart-total-usd').innerText = `$${totalUSD.toFixed(2)}`;
            document.getElementById('cart-total-ves').innerText = `Bs. ${(totalUSD * BCV_RATE).toLocaleString('es-VE', {minimumFractionDigits: 2})}`;
        }

        function checkoutWhatsApp() {
            if(cart.length === 0) return;
            let total = cart.reduce((s, i) => s + i.priceUSD, 0);
            let msg = `Hola Phantom Club, quiero pedir:\n` + cart.map(i => `- ${i.name} ($${i.priceUSD})`).join('\n') + `\nTotal: $${total.toFixed(2)}`;
            window.open(`https://wa.me/584128705612?text=${encodeURIComponent(msg)}`, '_blank');
        }

        document.addEventListener('DOMContentLoaded', initStore);
    </script>
</body>
</html>
